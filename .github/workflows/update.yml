name: Update Fragrance Gazette

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily = 10:00 Dubai. Edit to change timing.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build the page
        run: python fetch_and_build.py
      - name: Commit and push if changed
        run: |
          git config user.name "fragrance-gazette-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Auto-update: $(date -u +%Y-%m-%d)"
          git push
